<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>em·ji·ve</title>
<meta name="description" content="Item detail" />
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="em·ji·ve" />
<meta property="og:title" content="em·ji·ve" />
<meta property="og:description" content="Item detail" />
<meta property="og:url" content="https://mariusvnt.github.io/emjive/product.html" />
<meta property="og:image" content="https://mariusvnt.github.io/emjive/assets/products/marrow_ring/marrow_icon_steel.webp" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="em·ji·ve" />
<meta name="twitter:description" content="Item detail" />
<meta name="twitter:image" content="https://mariusvnt.github.io/emjive/assets/products/marrow_ring/marrow_icon_steel.webp" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />

<!-- Series resolution (which series this page shows, and its data).
     Blocking on purpose — see the header comment in js/series.js. -->
<script src="js/series.js"></script>

<!-- 3D viewer (glTF / GLB support, three.js + TrackballControls) -->
<script type="module" src="js/three-viewer.js"></script>
</head>
<body>


<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__brand" href="index.html#top">
      <img src="assets/logo.svg" alt="em&middot;ji&middot;ve" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteHeaderMenu">
      <span class="menu-toggle__bar menu-toggle__bar--h"></span>
      <span class="menu-toggle__bar menu-toggle__bar--v"></span>
    </button>
  </div>
  <div class="site-header__menu" id="siteHeaderMenu">
    <div class="site-header__menu-inner">
      <nav class="site-header__nav">
        <!-- These are hand-written, not rendered from data/products.json's
             "categories" list — that list is the source of truth for what
             categories exist, so keep this menu in sync with it by hand. -->
        <a href="index.html#products" class="is-cat">.ring</a>
        <a href="index.html#products" class="is-cat">.neck</a>
        <a href="index.html#products" class="is-cat">.wrist</a>
        <a href="index.html#contact" class="is-info">About us</a>
      </nav>
    </div>
  </div>
</header>

<main class="product-detail" id="productDetail">

  <p class="product-detail__loading" id="productDetailLoading">Loading…</p>

  <div class="product-detail__content" id="productDetailContent" hidden>

    <div class="product-detail__intro">

      <!-- 1. Product label -->
      <div class="product-detail__label-bar">
        <img class="product-detail__label-thumb" id="productLabelThumb" alt="" hidden />
        <h1 class="product-detail__label-text">
          <span class="product-detail__label-name" id="productLabelName"></span><span class="product-detail__label-type" id="productLabelType"></span>
        </h1>
        <span class="product-detail__label-price" id="productLabelPrice"></span>
      </div>

      <!-- 2. Carousel: 3D model (always slide 1) + real product photos.
           No visible arrows/outline — navigate by dragging horizontally,
           or tapping a slide to center it (see js/product.js). -->
      <div class="product-carousel-frame" id="productCarouselFrame">
        <img class="product-carousel__xray" id="productCarouselXray" alt="" hidden />
        <div class="product-carousel" id="productCarousel">
          <div class="product-carousel__viewport">
            <div class="product-carousel__track" id="productCarouselTrack"></div>
          </div>
        </div>
      </div>

      <!-- 3. Metal selection -->
      <div class="product-metals">
        <span class="product-metals__label">Metal</span>
        <div class="product-metals__options" id="productMetalOptions"></div>
      </div>

      <!-- 4. Select button -->
      <button class="product-detail__select" id="selectButton" type="button">Select</button>

    </div>

    <!-- 5. Item description -->
    <section class="product-detail__section">
      <div class="section-head">
        <h2>Description</h2>
      </div>
      <p class="product-detail__description" id="productDescription"></p>
    </section>

    <!-- 6. Technical characteristics (depends on the chosen metal) -->
    <section class="product-detail__section">
      <div class="section-head">
        <h2>Characteristics</h2>
      </div>
      <dl class="product-specs" id="productSpecs"></dl>
    </section>

    <!-- 7. Shipping & returns (static, same on every product) -->
    <section class="product-detail__section">
      <div class="section-head">
        <h2>Shipping &amp; Returns</h2>
      </div>
      <div class="product-detail__shipping">
        <p>Each piece is cast and finished to order — please allow 2–3 weeks before dispatch.</p>
        <p>Unworn items can be returned within 14 days of delivery for a full refund.</p>
      </div>
    </section>

  </div>
</main>

<!-- Size-selection modal, opened by the Select button -->
<div class="size-modal" id="sizeModal" aria-hidden="true">
  <div class="size-modal__backdrop" id="sizeModalBackdrop"></div>
  <div class="size-modal__panel" role="dialog" aria-modal="true" aria-labelledby="sizeModalTitle">
    <div class="size-modal__content">
      <h3 class="size-modal__title" id="sizeModalTitle">Choose a size</h3>

      <div class="size-modal__standard-row" id="sizeModalStandardRow">
        <span class="size-modal__standard-label">Standard sizes</span>
        <div class="size-modal__standard-options" id="sizeModalStandardOptions"></div>
      </div>

      <div class="size-modal__custom-row" id="sizeModalCustomRow">
        <span class="size-modal__custom-label">Custom size</span>
        <div class="size-modal__custom-field">
          <span class="size-modal__custom-underline">
            <input class="size-modal__custom-input" id="sizeModalCustomInput" type="text" inputmode="decimal" />
            <span class="size-modal__custom-unit" id="sizeModalCustomUnit"></span>
          </span>
        </div>
      </div>

      <div class="size-modal__guide-row">
        <button class="size-modal__size-guide-toggle" id="sizeModalGuideToggle" type="button">Size guide</button>
      </div>

      <div class="size-modal__size-guide" id="sizeModalGuide">
        <div class="size-modal__size-guide-inner">
          <div class="size-modal__size-guide-content" id="sizeModalGuideContent"></div>
        </div>
      </div>

      <button class="size-modal__confirm" id="sizeModalConfirm" type="button" disabled>Add to selection</button>
    </div>
  </div>
</div>

<!-- defer on main.js/product.js: js/three-viewer.js (a module, loaded in
     <head>) executes on the same deferred queue as defer'd classic
     scripts, in document order — since the module tag comes first, it's
     guaranteed to have already set window.EmjiveModelViewer by the time
     these run. Without defer, these would run inline as soon as the
     parser reached them, which can race ahead of the module (its own
     fetch("data/products.json") can resolve before the module has
     finished loading "three"). selection.js/selection-bar.js don't touch
     window.EmjiveModelViewer, so they're left as plain synchronous
     scripts — selection.js still runs (and sets window.EmjiveSelection)
     before the deferred pair below, same as today. -->
<script src="js/main.js" defer></script>
<script src="js/selection.js"></script>
<script src="js/product.js" defer></script>
<script src="js/selection-bar.js"></script>
</body>
</html>
