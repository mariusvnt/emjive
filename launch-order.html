<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Your selection — em·ji·ve</title>
<meta name="description" content="Your current selection" />
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="em·ji·ve" />
<meta property="og:title" content="Your selection — em·ji·ve" />
<meta property="og:description" content="Your current selection" />
<meta property="og:url" content="https://mariusvnt.github.io/emjive/launch-order.html" />
<meta property="og:image" content="https://mariusvnt.github.io/emjive/assets/series/bones/products/marrow_ring/marrow_icon_steel.webp" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Your selection — em·ji·ve" />
<meta name="twitter:description" content="Your current selection" />
<meta name="twitter:image" content="https://mariusvnt.github.io/emjive/assets/series/bones/products/marrow_ring/marrow_icon_steel.webp" />

<!-- Both typefaces are self-hosted (see the @font-face blocks in
     css/style.css) — this used to be a render-blocking Google Fonts
     stylesheet on a third-party origin. Preloaded rather than left for the
     CSS parser to discover: a webfont is otherwise found only once
     style.css has downloaded AND parsed, which puts it a full round trip
     behind everything else in the head.
     crossorigin is mandatory on a font preload even same-origin — fonts
     are always fetched in CORS mode, and a preload whose mode doesn't
     match the real request is simply downloaded twice. -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/geist-mono-woff2/GeistMono-latin.woff2" crossorigin />
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/dinish-woff2/DINish-Regular.woff2" crossorigin />

<!-- data/series.json gates EVERYTHING on every page: which series is
     shown, its products, and (on the homepage) the hero bundle, which
     can't even start until this resolves. js/series.js below fetches it,
     but only once the browser has downloaded and executed that script —
     so without this the request sits a round trip behind where it could.
     The preload scanner sees this while still parsing the head and starts
     it in parallel with series.js itself. -->
<link rel="preload" as="fetch" href="data/series.json" crossorigin />

<link rel="stylesheet" href="css/style.css" />

<!-- Series resolution (which series this page shows, and its data).
     Blocking on purpose — see the header comment in js/series.js. -->
<script src="js/series.js"></script>
</head>
<body id="top">


<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__brand" href="index.html#top">
      <img src="assets/logo.svg" alt="em&middot;ji&middot;ve" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteHeaderMenu">
      <span class="menu-toggle__bar menu-toggle__bar--h"></span>
      <span class="menu-toggle__bar menu-toggle__bar--v"></span>
    </button>
  </div>
  <div class="site-header__menu" id="siteHeaderMenu">
    <div class="site-header__menu-inner">
      <nav class="site-header__nav">
        <!-- Filter row: the buttons are rendered by js/main.js from the
             ACTIVE series' own category list (data/series.json) — don't
             hand-write them, and don't assume three: each series declares
             its own subset of the global vocabulary. On every page but
             the grid this becomes a plain "Gallery" link instead — see
             js/main.js's renderHeaderFilter(). -->
        <div class="site-header__filter" id="siteHeaderFilter">
          <span class="site-header__filter-label">Filter gallery by</span>
          <span class="site-header__filter-options" id="headerFilterOptions"></span>
        </div>
        <a href="archives.html" class="is-info">Archives</a>
        <a href="creation-process.html" class="is-info">Creation process</a>
      </nav>
    </div>
  </div>
</header>

<main class="selection-page">
  <!-- Visually hidden for the same reason index.html's is: the design has
       nowhere to put a visible title (the page opens on the item list), but
       it had no heading at all. See .visually-hidden in css/style.css. -->
  <h1 class="visually-hidden">Your selection</h1>

  <div class="selection-empty" id="selectionEmpty">
    <p>No selected item</p>
    <a class="selection-empty__back" href="index.html#products">Back to gallery</a>
  </div>

  <div class="selection-list" id="selectionList" hidden>
    <!-- Item rows: full-bleed dark panel, same weight as the product page's
         black CTA bars. Rows built by js/selection-page.js. -->
    <ul class="order-items" id="selectionItems"></ul>

    <section class="order-shipping">
      <div class="order-shipping__options" id="orderShippingOptions"></div>
    </section>

    <div class="order-terms" id="orderTerms">
      <p class="order-terms__text">I have read and accept the <a href="terms.html">terms &amp; conditions</a>.</p>
      <button type="button" class="order-terms__toggle" id="orderTermsToggle" aria-pressed="false" aria-label="Accept the terms and conditions"></button>
    </div>
  </div>
</main>

<!-- Checkout bar: page-specific, not the site-wide js/selection-bar.js
     (this page has never carried that — see pages.md). Liquid-glass style,
     same height as the standard bar, single "Proceed to checkout" CTA. -->
<div class="order-checkout-bar" id="orderCheckoutBar" hidden>
  <div class="order-checkout-bar__row">
    <span class="order-checkout-bar__total" id="orderCheckoutTotal"></span>
    <button type="button" class="order-checkout-bar__button" id="orderCheckoutButton" disabled>Proceed to checkout</button>
  </div>
</div>

<!-- "Modify" popup, opened from an item row's overlay — same size-modal
     pattern product.html's Select button uses, with a metal picker added
     above the size row. Static/empty here; js/selection-page.js
     repopulates both per item each time it opens, since different rows
     can be different products (even different series).

     role/aria-modal/aria-label sit on THIS element rather than on
     .size-modal__panel, for the reason product.html's own size modal
     documents: the "Size guide" toggle is a sibling of the panel, and
     aria-modal hides everything outside the declared dialog. -->
<div class="size-modal" id="modifyModal" aria-hidden="true"
     role="dialog" aria-modal="true" aria-label="Modify selection" tabindex="-1">
  <div class="size-modal__backdrop" id="modifyModalBackdrop"></div>
  <div class="size-modal__panel">
    <div class="size-modal__content">
      <div class="product-metals">
        <span class="product-metals__label">Metal</span>
        <div class="product-metals__options" id="modifyModalMetalOptions"></div>
      </div>

      <div class="size-modal__standard-row" id="modifyModalStandardRow">
        <span class="size-modal__standard-label">Standard sizes</span>
        <div class="size-modal__standard-options" id="modifyModalStandardOptions"></div>
      </div>

      <div class="size-modal__custom-row" id="modifyModalCustomRow">
        <span class="size-modal__custom-label">Custom size</span>
        <div class="size-modal__custom-field">
          <span class="size-modal__custom-underline">
            <input class="size-modal__custom-input" id="modifyModalCustomInput" type="text" inputmode="decimal" />
            <span class="size-modal__custom-unit" id="modifyModalCustomUnit"></span>
          </span>
        </div>
      </div>

      <button class="size-modal__confirm" id="modifyModalConfirm" type="button" disabled>Save</button>
    </div>
  </div>
  <div class="size-modal__guide">
    <button class="size-modal__guide-toggle" id="modifyModalGuideToggle" type="button">Size guide</button>
    <div class="size-modal__guide-panel" id="modifyModalGuide">
      <div class="size-modal__guide-panel-inner">
        <div class="size-modal__guide-content" id="modifyModalGuideContent"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
<!-- Before js/selection-page.js, which uses window.EmjiveFocusTrap. Only
     loaded on the two pages that have a modal. -->
<script src="js/focus-trap.js"></script>
<script src="js/selection.js"></script>
<script src="js/selection-page.js"></script>
</body>
</html>
