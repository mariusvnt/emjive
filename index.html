<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>em·ji·ve</title>
<meta name="description" content="Digital gallery of innovative jewelry" />
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="em·ji·ve" />
<meta property="og:title" content="em·ji·ve" />
<meta property="og:description" content="Digital gallery of innovative jewelry" />
<meta property="og:url" content="https://mariusvnt.github.io/emjive/" />
<meta property="og:image" content="https://mariusvnt.github.io/emjive/assets/series/bones/products/marrow_ring/marrow_icon_steel.webp" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="em·ji·ve" />
<meta name="twitter:description" content="Digital gallery of innovative jewelry" />
<meta name="twitter:image" content="https://mariusvnt.github.io/emjive/assets/series/bones/products/marrow_ring/marrow_icon_steel.webp" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />

<!-- Series resolution (which series this page shows, and its data).
     Blocking on purpose — see the header comment in js/series.js. -->
<script src="js/series.js"></script>

<!-- 3D viewer (glTF / GLB support, three.js + TrackballControls) -->
<script type="module" src="js/three-viewer.js"></script>
</head>
<!-- has-series-hero is static markup on purpose: css/style.css uses it to
     keep the floating selection bar off-screen until the hero's scroll
     publishes a position. The rule it replaced, body:has(#revealSection),
     can't work now that the hero arrives at runtime — :has() is live, so it
     wouldn't match at first paint and the bar would flash in, then snap
     away once the fragment landed. -->
<body id="top" class="has-series-hero">


<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__brand" href="#top">
      <img src="assets/logo.svg" alt="em&middot;ji&middot;ve" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteHeaderMenu">
      <span class="menu-toggle__bar menu-toggle__bar--h"></span>
      <span class="menu-toggle__bar menu-toggle__bar--v"></span>
    </button>
  </div>
  <div class="site-header__menu" id="siteHeaderMenu">
    <div class="site-header__menu-inner">
      <nav class="site-header__nav">
        <a href="creation-process.html" class="is-info">Creation process</a>
        <a href="archives.html" class="is-info">Archives</a>
        <!-- Filter row: the buttons are rendered by js/main.js from the
             ACTIVE series' own category list (data/series.json) — don't
             hand-write them, and don't assume three: each series declares
             its own subset of the global vocabulary. That same script
             hides this whole row ([hidden]) when the subset has one
             category or fewer, since there's nothing to filter. -->
        <div class="site-header__filter" id="siteHeaderFilter">
          <span class="site-header__filter-label">Filter by</span>
          <span class="site-header__filter-options" id="headerFilterOptions"></span>
        </div>
      </nav>
    </div>
  </div>
</header>

<main>

  <!-- The featured series' hero is injected here by js/series.js, from that
       series' hero bundle (series/<slug>/hero.{html,css,js}). Which series
       is featured is one field — "featured" — in data/series.json. -->
  <div class="series-hero" id="seriesHero"></div>

  <section class="products" id="products">
    <!-- Second hero slot: art that has to sit inside .products, behind the
         grid, rather than inside the hero section itself. -->
    <div class="series-hero-backdrop" id="seriesBackdrop"></div>

    <div class="product-grid" id="productGrid">
      <!-- Product cards are rendered here by js/main.js from data/products.json -->
      <p class="product-grid__loading">Loading specimens…</p>
    </div>
  </section>


</main>

<!-- defer: js/three-viewer.js (a module, loaded in <head>) executes on the
     same deferred queue as this script, in document order — since the
     module tag comes first, it's guaranteed to have already set
     window.EmjiveModelViewer by the time this runs. Without defer, this
     plain classic script would run inline as soon as the parser reaches
     it, which can race ahead of the module (its fetch("data/products.json")
     can resolve before the module has finished loading "three"). -->
<script src="js/main.js" defer></script>
<script src="js/selection.js"></script>
<script src="js/selection-bar.js"></script>
</body>
</html>
