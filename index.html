<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>em·ji·ve</title>
<meta name="description" content="em·ji·ve — handcrafted rings and jewelry." />
<link rel="icon" type="image/svg+xml" href="assets/logo_compact.svg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />

<!-- 3D viewer (glTF / GLB support, three.js + TrackballControls) -->
<script type="module" src="js/three-viewer.js"></script>
</head>
<body id="top">


<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__brand" href="#top">
      <img src="assets/logo.svg" alt="em&middot;ji&middot;ve" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteHeaderMenu">
      <span class="menu-toggle__bar menu-toggle__bar--h"></span>
      <span class="menu-toggle__bar menu-toggle__bar--v"></span>
    </button>
  </div>
  <div class="site-header__menu" id="siteHeaderMenu">
    <div class="site-header__menu-inner">
      <nav class="site-header__nav">
        <!-- These are hand-written, not rendered from data/products.json's
             "categories" list — that list is the source of truth for what
             categories exist, so keep this menu in sync with it by hand. -->
        <a href="#products" class="is-cat">.ring</a>
        <a href="#products" class="is-cat">.neck</a>
        <a href="#products" class="is-cat">.wrist</a>
        <a href="#contact" class="is-info">About us</a>
      </nav>
    </div>
  </div>
</header>

<main>

  <section class="reveal" id="revealSection">
    <div class="reveal__pin">
      <div class="reveal__stage">
        <img class="reveal__img reveal__img--normal" src="assets/hand-rings-under-flesh_4k.webp" alt="" />
        <div class="reveal__xray-group" id="revealXrayGroup">
          <img class="reveal__img--xray" src="assets/hand_xray.webp" alt="" />
          <!-- .reveal__ring <img>s are inserted here by js/main.js's
               updateHeroRings() — one per product whose onHand.visible
               is true in data/products.json, not a fixed single element. -->
        </div>
      </div>
      <div class="reveal__frontier" id="revealFrontier"></div>
      <p class="reveal__scan-hint" id="revealScanHint">Scroll to scan</p>
    </div>
  </section>

  <section class="products" id="products">
    <div class="reveal__extension-crop">
      <img class="reveal__extension reveal__extension--1" src="assets/hand_xray_extension_1.webp" alt="" />
      <img class="reveal__extension reveal__extension--2" src="assets/hand_xray_extension_2.webp" alt="" />
    </div>

    <div class="product-grid" id="productGrid">
      <!-- Product cards are rendered here by js/main.js from data/products.json -->
      <p class="product-grid__loading">Loading specimens…</p>
    </div>
  </section>


</main>

<!-- defer: js/three-viewer.js (a module, loaded in <head>) executes on the
     same deferred queue as this script, in document order — since the
     module tag comes first, it's guaranteed to have already set
     window.EmjiveModelViewer by the time this runs. Without defer, this
     plain classic script would run inline as soon as the parser reaches
     it, which can race ahead of the module (its fetch("data/products.json")
     can resolve before the module has finished loading "three"). -->
<script src="js/main.js" defer></script>
<script src="js/selection.js"></script>
<script src="js/selection-bar.js"></script>
</body>
</html>
