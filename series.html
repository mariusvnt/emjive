<link rel="stylesheet" href="css/style.css" />

<!-- Series resolution (which series this page shows, and its data).
     Blocking on purpose — see the header comment in js/series.js. -->
<script src="js/series.js"></script>
</head>
<body id="top">


<header class="site-header">
  <div class="site-header__row">
    <a class="site-header__brand" href="index.html#top">
      <img src="assets/logo.svg" alt="em&middot;ji&middot;ve" />
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu" aria-expanded="false" aria-controls="siteHeaderMenu">
      <span class="menu-toggle__bar menu-toggle__bar--h"></span>
      <span class="menu-toggle__bar menu-toggle__bar--v"></span>
    </button>
  </div>
  <div class="site-header__menu" id="siteHeaderMenu">
    <div class="site-header__menu-inner">
      <nav class="site-header__nav">
        <!-- Filter row: the buttons are rendered by js/main.js from the
             ACTIVE series' own category list (data/series.json) — don't
             hand-write them, and don't assume three: each series declares
             its own subset of the global vocabulary. On every page but
             the grid this becomes a plain "Gallery" link instead — see
             js/main.js's renderHeaderFilter(). -->
        <div class="site-header__filter" id="siteHeaderFilter">
          <span class="site-header__filter-label">Filter gallery by</span>
          <span class="site-header__filter-options" id="headerFilterOptions"></span>
        </div>
        <a href="archives.html" class="is-info">Archives</a>
        <a href="creation-process.html" class="is-info">Creation process</a>
      </nav>
    </div>
  </div>
</header>

<!-- One page renders ANY series' manifest, from that series' manifest.json
     (data/series/<slug>/manifest.json), selected by ?series=<slug>. Adding a
     series never means adding a page. -->
<main class="page-shell series-manifest" id="seriesManifest">
  <p class="page-shell__loading" id="seriesManifestLoading">Loading…</p>

  <div class="series-manifest__content" id="seriesManifestContent" hidden>
    <div class="section-head">
      <span class="section-head__index" id="seriesManifestYear"></span>
      <h2 id="seriesManifestTitle"></h2>
    </div>
    <p class="series-manifest__subtitle" id="seriesManifestSubtitle"></p>

    <div class="series-manifest__body" id="seriesManifestBody">
      <!-- Deliberately empty — this page is a shell waiting on its design.

           manifest.json's "sections" array gets rendered here later; its
           entry schema ({ id, heading, body[], media[] }) is documented in
           dev-guidelines/data.md but nothing reads it yet. -->
    </div>
  </div>
</main>

<script src="js/main.js"></script>
<script src="js/series-page.js"></script>
<script src="js/selection.js"></script>
<script src="js/selection-bar.js"></script>
</body>
</html>
